name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The repository is public, so GitHub-hosted macOS runners are free of charge.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        run: make test

      # The runner has no signing identity, so the app is built unsigned and the embed build phase
      # falls back to ad-hoc signing. Such a build cannot use the shared Keychain access group,
      # which is why tests against the real Keychain are not part of CI.
      - name: Build the macOS app and the embedded command-line tool
        run: make build-macos SIGNING_FLAGS='CODE_SIGNING_ALLOWED=NO'

      - name: Build the iOS app
        run: make build-ios IOS_SIGNING_FLAGS='CODE_SIGNING_ALLOWED=NO'
