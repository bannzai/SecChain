# Opens the macOS app in the desktop session of a GitHub Actions macOS runner and exposes it to the
# maintainer's tailnet through WebDriverAgentMac, so that screens are checked without launching the
# app on a local Mac. The work is done by the reusable workflow of simtunnel
# (https://github.com/bannzai/simtunnel, PROJECT.md "macOS アプリの操作（WebDriverAgentMac）").
# Usage: AGENTS.md, "Checking screens".
name: macos-app-session
# local/simtunnel finds its run by this name (it must start with session=<name>).
run-name: "session=${{ inputs.session }} runner=${{ inputs.runner }}"

on:
  # Manual dispatch only, so that pull requests from forks never receive the Tailscale secrets.
  workflow_dispatch:
    # local/simtunnel always sends session / device / duration_minutes, and a dispatch with an
    # undeclared input is rejected.
    inputs:
      session:
        description: "Session name; the runner joins the tailnet as simtunnel-<session> (lowercase letters, digits, hyphens)"
        required: true
        default: secchain-mac
      device:
        description: "Unused on macOS; declared because local/simtunnel sends it"
        required: false
        default: "-"
      duration_minutes:
        description: "Minutes the session stays open"
        required: true
        default: "60"
      runner:
        description: "macOS runner label. SecChainCore needs Swift tools 6.2, which ships with Xcode 26 (macos-26)"
        required: false
        default: macos-26

jobs:
  session:
    # Only the job that calls the reusable workflow gets an OIDC token.
    permissions:
      id-token: write # Tailscale authenticates the runner through OIDC
      contents: read
    # simtunnel has no release tags, so a commit of its main branch is pinned.
    uses: bannzai/simtunnel/.github/workflows/macos-session.yml@aa02a15765a76ab4c27d7e3fbd2eca6f17432b77 # main 2026-09-12
    with:
      session: ${{ inputs.session }}
      runner: ${{ inputs.runner }}
      duration_minutes: ${{ inputs.duration_minutes }}
      build_project: SecChain.xcodeproj
      build_scheme: SecChain
      # The runner has no signing identity, and the reusable workflow passes no extra build flags,
      # so the macOS target has a configuration that is Debug without code signing. Such a build
      # cannot reach the shared Keychain access group: the app opens on its "cannot reach its
      # Keychain items" screen, where a debug build offers demo data.
      build_configuration: DebugUnsigned
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
